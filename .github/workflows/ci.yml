name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax check
        run: python -m compileall -q unmultitrack.py tests
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $parseErrors | ForEach-Object { Write-Host $_ }
                  $failed = $true
              }
          }
          if ($failed) { throw 'PowerShell parse checks failed.' }
      - name: Installer helper checks
        shell: pwsh
        run: ./tests/test-install.ps1
